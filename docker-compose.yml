version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - stock-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/stock_db
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:5001
    depends_on:
      - mongo
      - redis
      - ml-service
    networks:
      - stock-network
    volumes:
      - ./backend/src:/app/src

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=development
      - PORT=5001
    networks:
      - stock-network
    volumes:
      - ./ml-service:/app

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - stock-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - stock-network

volumes:
  mongo-data:

networks:
  stock-network:
    driver: bridge
